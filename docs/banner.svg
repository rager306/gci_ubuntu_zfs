<svg xmlns="http://www.w3.org/2000/svg" width="920" height="220" viewBox="0 0 920 220" role="img" aria-label="Ubuntu Server root on ZFS banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="pool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <rect width="920" height="220" rx="16" fill="url(#bg)"/>
  <circle cx="880" cy="30" r="130" fill="#0ea5a4" opacity="0.06"/>
  <circle cx="40" cy="200" r="110" fill="#E95420" opacity="0.07"/>

  <rect x="48" y="50" width="6" height="118" rx="3" fill="#E95420"/>
  <text x="76" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#f8fafc">Ubuntu Server &#183; Root on ZFS</text>
  <text x="76" y="126" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#94a3b8">Packer-built cloud image &#183; lz4 compression &#183; snapshots &#183; self-healing</text>
  <text x="76" y="152" font-family="ui-monospace, Consolas, monospace" font-size="14" fill="#5eead4">rpool &#8594; /  &#183;  auto-grows to the whole disk  &#183;  Contabo-ready</text>

  <g font-family="ui-monospace, Consolas, monospace" font-size="13">
    <rect x="648" y="46" width="224" height="34" rx="8" fill="url(#pool)"/>
    <text x="664" y="68" fill="#042f2e" font-weight="700">rpool/ROOT/ubuntu</text>
    <rect x="648" y="90" width="224" height="34" rx="8" fill="#334155"/>
    <text x="664" y="112" fill="#cbd5e1">rpool/var &#183; rpool/home</text>
    <rect x="648" y="134" width="224" height="34" rx="8" fill="#334155"/>
    <text x="664" y="156" fill="#cbd5e1">rpool/tmp &#183; rpool/var/docker</text>
  </g>
</svg>
