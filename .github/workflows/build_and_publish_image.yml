name: packer

on:
  push:

env:
  PACKER_VERSION: "latest"

permissions:
  contents: write

jobs:
  build_n_publish:
    # Pinned: ubuntu-latest moved to a newer image where installing
    # qemu-system fails with unmet dependencies (apt exit code 100).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        ubuntu-release: ["ubuntu-24-contabo"]
    name: Build Image for ${{ matrix.ubuntu-release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup `packer`
        uses: hashicorp/setup-packer@main
        with:
          version: ${{ env.PACKER_VERSION }}
      - name: Set up QEMU
        run: |
          # apt may transiently fail with exit code 100 (lock held by
          # unattended-upgrades, flaky mirror) — retry and wait for locks.
          ok=0
          for i in 1 2 3; do
            if sudo apt-get update -o Acquire::Retries=5; then ok=1; break; fi
            echo "apt-get update attempt $i failed, retrying in 15s"
            sleep 15
          done
          [ "$ok" = 1 ]
          while sudo fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock >/dev/null 2>&1; do
            echo "waiting for apt locks to be released"
            sleep 5
          done
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            qemu-system-amd64 qemu-utils
      - name: Install cloud-image-utils (genisoimage for the cidata ISO)
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y cloud-image-utils
      - name: Build image ${{ matrix.ubuntu-release }}
        run: sudo ./build.sh ${{ matrix.ubuntu-release }}
      - name: Save artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.ubuntu-release }}-qcow2
          path: templates/${{ matrix.ubuntu-release }}/output/${{ matrix.ubuntu-release }}_zfs.qcow2
      - name: Publish image (for tags only)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: templates/${{ matrix.ubuntu-release }}/output/${{ matrix.ubuntu-release }}_zfs.qcow2
          asset_name: ${{ matrix.ubuntu-release }}_zfs.qcow2
          tag: ${{ github.ref }}
          overwrite: true
          body: "Ubuntu 24.04 root-on-ZFS for Contabo (SeaBIOS, static netplan, baked ssh key)."
